<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JATS Extension Settings</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="options">
      <h1>Job Application Tracker &mdash; Settings</h1>

      <section id="loggedInSection" class="hidden">
        <p>Logged in as <strong id="loggedInEmail"></strong></p>
        <p id="accountStatusNotice" class="notice hidden"></p>
        <button id="logoutBtn" type="button">Log out</button>
      </section>

      <section id="loginSection">
        <form id="loginForm">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />

          <label for="password">Password</label>
          <input id="password" name="password" type="password" required />

          <button id="loginBtn" type="submit">Log in</button>
        </form>
      </section>

      <p id="statusMessage" class="status hidden"></p>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
